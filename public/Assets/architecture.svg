<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Virtual Try-On Studio architecture flow</title>
  <desc id="d">The browser app calls one of three Supabase Edge Functions. Each function sends the request through an AI gateway to a Gemini model and the result returns to the browser. An alternate set of Vercel API functions that call Gemini directly exists in the api folder but the frontend does not call it.</desc>
  <defs>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .bg{fill:#f3eadf;stroke:#d6c3ab;stroke-width:1.5}
      .card{fill:#fbf3e8;stroke:#c9b295;stroke-width:1.5}
      .band{fill:#ead8c3;fill-opacity:.92;stroke:#c9b295;stroke-width:1.5}
      .alt{fill:#f7ecdf;stroke:#b79a7c;stroke-width:1.5;stroke-dasharray:6 6}
      .t1{font-size:28px;font-weight:600;fill:#3b2a1e}
      .t2{font-size:20px;font-weight:600;fill:#3b2a1e}
      .t2.mono{font-size:16px;font-weight:600}
      .sub{font-size:13px;fill:#6a503e}
      .sub.mono{font-size:10.5px}
      .head{font-size:11px;font-weight:600;letter-spacing:.2em;fill:#8d2c0d}
      .note{font-size:12px;fill:#6a503e}
      .req{fill:none;stroke:#8d2c0d;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 8;animation:flow 1.1s linear infinite}
      .res{fill:none;stroke:#aa7a59;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 8;animation:flow 1.1s linear infinite reverse}
      .ghost{fill:none;stroke:#b79a7c;stroke-width:1.5;stroke-dasharray:5 6}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @media (prefers-reduced-motion:reduce){
        .req,.res{animation:none}
        .dot{display:none}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#aa7a59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="688" rx="24" class="bg"/>

  <text x="80" y="62" class="serif t1">How a request flows</text>
  <text x="80" y="86" class="sans sub">Browser to Supabase Edge Function to AI gateway to Gemini, and back.</text>

  <g class="sans note">
    <circle cx="905" cy="58" r="5" fill="#8d2c0d"/><text x="918" y="62">request</text>
    <circle cx="990" cy="58" r="5" fill="#aa7a59"/><text x="1003" y="62">response</text>
  </g>

  <text x="195" y="124" text-anchor="middle" class="sans head">BROWSER</text>
  <text x="195" y="141" text-anchor="middle" class="sans sub" style="font-size:12px">React app, hosted on Vercel</text>
  <text x="565" y="124" text-anchor="middle" class="sans head">SUPABASE</text>
  <text x="565" y="141" text-anchor="middle" class="sans sub" style="font-size:12px">Edge Functions on Deno</text>
  <text x="760" y="124" text-anchor="middle" class="sans head">GATEWAY</text>
  <text x="990" y="124" text-anchor="middle" class="sans head">GEMINI MODELS</text>
  <text x="990" y="141" text-anchor="middle" class="sans sub" style="font-size:12px">Called through the gateway</text>

  <!-- paths -->
  <defs>
    <path id="rq1" d="M290 201H880"/>
    <path id="rs1" d="M880 229H290"/>
    <path id="rq2" d="M290 321H880"/>
    <path id="rs2" d="M880 349H290"/>
    <path id="rq3" d="M290 441H880"/>
    <path id="rs3" d="M880 469H290"/>
  </defs>

  <use xlink:href="#rq1" href="#rq1" class="req"/>
  <use xlink:href="#rs1" href="#rs1" class="res"/>
  <use xlink:href="#rq2" href="#rq2" class="req"/>
  <use xlink:href="#rs2" href="#rs2" class="res"/>
  <use xlink:href="#rq3" href="#rq3" class="req"/>
  <use xlink:href="#rs3" href="#rs3" class="res"/>
  <circle class="dot" r="5" fill="#8d2c0d" opacity="0">
    <animateMotion dur="7s" begin="0.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"><mpath xlink:href="#rq1" href="#rq1"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="0.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.37;0.4;1"/>
  </circle>
  <circle class="dot" r="5" fill="#aa7a59" opacity="0">
    <animateMotion dur="7s" begin="0.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.95;1"><mpath xlink:href="#rs1" href="#rs1"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="0.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.92;0.95;1"/>
  </circle>
  <circle class="dot" r="5" fill="#8d2c0d" opacity="0">
    <animateMotion dur="7s" begin="0.7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"><mpath xlink:href="#rq2" href="#rq2"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="0.7s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.37;0.4;1"/>
  </circle>
  <circle class="dot" r="5" fill="#aa7a59" opacity="0">
    <animateMotion dur="7s" begin="0.7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.95;1"><mpath xlink:href="#rs2" href="#rs2"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="0.7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.92;0.95;1"/>
  </circle>
  <circle class="dot" r="5" fill="#8d2c0d" opacity="0">
    <animateMotion dur="7s" begin="1.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1"><mpath xlink:href="#rq3" href="#rq3"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="1.4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.37;0.4;1"/>
  </circle>
  <circle class="dot" r="5" fill="#aa7a59" opacity="0">
    <animateMotion dur="7s" begin="1.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.95;1"><mpath xlink:href="#rs3" href="#rs3"/></animateMotion>
    <animate attributeName="opacity" dur="7s" begin="1.4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.92;0.95;1"/>
  </circle>

  <!-- gateway band -->
  <rect x="730" y="160" width="60" height="326" rx="14" class="band"/>
  <text transform="translate(765 323) rotate(-90)" text-anchor="middle" class="mono" style="font-size:12px;fill:#6a503e;letter-spacing:.04em">ai.gateway.lovable.dev</text>

  <g>
    <rect x="80" y="173" width="230" height="84" rx="14" class="card"/>
    <text x="100" y="213.0" class="serif t2">Try-on</text>
    <text x="100" y="237.0" class="sans sub">Photo + fabric or color</text>
  </g>
  <g>
    <rect x="450" y="173" width="230" height="84" rx="14" class="card"/>
    <text x="470" y="213.0" class="mono t2">tryon</text>
    <text x="470" y="237.0" class="sans sub">Edge Function</text>
  </g>
  <g>
    <rect x="860" y="173" width="260" height="84" rx="14" class="card"/>
    <text x="880" y="213.0" class="mono t2">gemini-2.5-flash-image</text>
    <text x="880" y="237.0" class="sans sub">Generates the try-on image</text>
  </g>
  <g>
    <rect x="80" y="293" width="230" height="84" rx="14" class="card"/>
    <text x="100" y="333.0" class="serif t2">Color match</text>
    <text x="100" y="357.0" class="sans sub">Photo + outfit</text>
  </g>
  <g>
    <rect x="450" y="293" width="230" height="84" rx="14" class="card"/>
    <text x="470" y="333.0" class="mono t2">style-recommend</text>
    <text x="470" y="357.0" class="sans sub">Edge Function</text>
  </g>
  <g>
    <rect x="860" y="293" width="260" height="84" rx="14" class="card"/>
    <text x="880" y="333.0" class="mono t2">gemini-2.5-flash</text>
    <text x="880" y="357.0" class="sans sub">Skin tone and 3 colors as JSON</text>
  </g>
  <g>
    <rect x="80" y="413" width="230" height="84" rx="14" class="card"/>
    <text x="100" y="453.0" class="serif t2">Model shots</text>
    <text x="100" y="477.0" class="sans sub">Garment photo</text>
  </g>
  <g>
    <rect x="450" y="413" width="230" height="84" rx="14" class="card"/>
    <text x="470" y="453.0" class="mono t2">ghost-mannequin</text>
    <text x="470" y="477.0" class="sans sub">Edge Function</text>
  </g>
  <g>
    <rect x="860" y="413" width="260" height="84" rx="14" class="card"/>
    <text x="880" y="453.0" class="mono t2">gemini-2.5-flash-image</text>
    <text x="880" y="477.0" class="sans sub">Generates the model shot</text>
  </g>

  <!-- hand-off between Color match and Try-on -->
  <path d="M80 335C40 335 40 215 80 215" fill="none" stroke="#aa7a59" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <text transform="translate(33 275) rotate(-90)" text-anchor="middle" class="sans" style="font-size:11px;fill:#6a503e">localStorage</text>

  <!-- lane 1 labels -->
  <text x="380" y="190" text-anchor="middle" class="sans note" style="font-size:11px">photos + options</text>
  <text x="380" y="248" text-anchor="middle" class="sans note" style="font-size:11px">image or JSON</text>


  <!-- alternate backend -->
  <text x="80" y="574" class="serif" style="font-size:17px;font-weight:600;fill:#3b2a1e">Alternate backend</text>
  <text x="80" y="594" class="sans note">Present in api/, but the</text>
  <text x="80" y="610" class="sans note">frontend does not call it.</text>
  <rect x="450" y="548" width="230" height="64" rx="14" class="alt"/>
  <text x="470" y="577" class="serif" style="font-size:17px;font-weight:600;fill:#3b2a1e">Vercel api/ functions</text>
  <text x="470" y="597" class="sans note">Same three tools</text>
  <path d="M680 580H858" class="ghost" marker-end="url(#arrow)"/>
  <rect x="860" y="548" width="260" height="64" rx="14" class="alt"/>
  <text x="880" y="577" class="serif" style="font-size:17px;font-weight:600;fill:#3b2a1e">Gemini API, direct</text>
  <text x="880" y="597" class="mono" style="font-size:10.5px;fill:#6a503e">generativelanguage.googleapis.com</text>

  <text x="80" y="656" class="sans note">No database or file storage in this flow. Photos stay in browser memory and in each request.</text>
</svg>
