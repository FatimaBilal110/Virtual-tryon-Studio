<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Folder map</title>
  <desc id="d">Top-level folders of Virtual Try-On Studio. src holds the frontend: components, pages, integrations and lib. supabase holds the Edge Functions tryon, style-recommend and ghost-mannequin. public holds static assets and brand media.</desc>
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-size:22px;font-weight:700;fill:#e6edf3}
      .kicker{font-size:11px;font-weight:600;letter-spacing:.28em;fill:#4da3ff}
      .name{font-size:16px;font-weight:700;fill:#e6edf3}
      .desc{font-size:14.5px;fill:#8b949e}
      .fn{font-size:13px;fill:#2dd4bf}
      .line{fill:none;stroke:#3a4250;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .lead{fill:none;stroke:#2b3240;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 6}
      .hl{animation:hl 9.8s step-end infinite}
      @keyframes hl{
        0%{transform:translateY(0)}
        14.2857%{transform:translateY(44px)}
        28.5714%{transform:translateY(88px)}
        42.8571%{transform:translateY(132px)}
        57.1428%{transform:translateY(176px)}
        71.4285%{transform:translateY(220px)}
        85.7142%{transform:translateY(264px)}
        100%{transform:translateY(0)}
      }
      @media (prefers-reduced-motion:reduce){ .hl{animation:none;display:none} }
    </style>
    <clipPath id="card"><rect x="0.5" y="0.5" width="999" height="429" rx="18"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="429" rx="18" fill="#0b0f17"/>
  <rect x="0.5" y="0.5" width="999" height="429" rx="18" fill="none" stroke="#232a36"/>

